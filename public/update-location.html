<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Business Location</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        
        .header {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .subtitle {
            color: #86868b;
            font-size: 16px;
        }
        
        .location-info {
            background: #f2f2f7;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }
        
        .location-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e5e5e7;
        }
        
        .location-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }
        
        .label {
            font-weight: 600;
            color: #1d1d1f;
        }
        
        .value {
            color: #86868b;
            text-align: right;
        }
        
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 12px;
        }
        
        .btn-primary {
            background: #007aff;
            color: #fff;
        }
        
        .btn-primary:hover {
            background: #0056cc;
        }
        
        .btn-secondary {
            background: #f2f2f7;
            color: #1d1d1f;
        }
        
        .btn-secondary:hover {
            background: #e5e5e7;
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .status {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #007aff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">📍 Update Business Location</h1>
            <p class="subtitle">Get your current device location and update your business profile</p>
        </div>
        
        <div class="status" id="status"></div>
        
        <div class="location-info" id="locationInfo" style="display: none;">
            <h3 style="margin-bottom: 16px;">📍 Current Location</h3>
            <div class="location-item">
                <span class="label">Latitude:</span>
                <span class="value" id="latitude">-</span>
            </div>
            <div class="location-item">
                <span class="label">Longitude:</span>
                <span class="value" id="longitude">-</span>
            </div>
            <div class="location-item">
                <span class="label">Accuracy:</span>
                <span class="value" id="accuracy">-</span>
            </div>
            <div class="location-item">
                <span class="label">Address:</span>
                <span class="value" id="address">-</span>
            </div>
        </div>
        
        <button class="btn btn-primary" id="getLocationBtn" onclick="getCurrentLocation()">
            📍 Get My Current Location
        </button>
        
        <button class="btn btn-secondary" id="updateLocationBtn" onclick="updateBusinessLocation()" disabled>
            💾 Update Business Location
        </button>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Updating location...</p>
        </div>
    </div>

    <script>
        let currentLocation = null;
        let currentAddress = null;
        
        function showStatus(message, type = 'success') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';
            
            setTimeout(() => {
                status.style.display = 'none';
            }, 5000);
        }
        
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
            document.getElementById('getLocationBtn').disabled = show;
            document.getElementById('updateLocationBtn').disabled = show;
        }
        
        async function getCurrentLocation() {
            if (!navigator.geolocation) {
                showStatus('Geolocation is not supported by this browser.', 'error');
                return;
            }
            
            showLoading(true);
            
            try {
                const position = await new Promise((resolve, reject) => {
                    navigator.geolocation.getCurrentPosition(resolve, reject, {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 60000
                    });
                });
                
                currentLocation = {
                    latitude: position.coords.latitude,
                    longitude: position.coords.longitude,
                    accuracy: position.coords.accuracy
                };
                
                // Display location info
                document.getElementById('latitude').textContent = currentLocation.latitude.toFixed(6);
                document.getElementById('longitude').textContent = currentLocation.longitude.toFixed(6);
                document.getElementById('accuracy').textContent = `${Math.round(currentLocation.accuracy)} meters`;
                
                // Get address from coordinates
                await getAddressFromCoordinates(currentLocation.latitude, currentLocation.longitude);
                
                document.getElementById('locationInfo').style.display = 'block';
                document.getElementById('updateLocationBtn').disabled = false;
                
                showStatus('Location obtained successfully!', 'success');
                
            } catch (error) {
                console.error('Error getting location:', error);
                showStatus('Failed to get location: ' + error.message, 'error');
            } finally {
                showLoading(false);
            }
        }
        
        async function getAddressFromCoordinates(lat, lng) {
            try {
                const response = await fetch(
                    `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`
                );
                
                if (!response.ok) {
                    throw new Error('Failed to get address');
                }
                
                const data = await response.json();
                currentAddress = data.display_name;
                
                document.getElementById('address').textContent = currentAddress;
                
            } catch (error) {
                console.error('Error getting address:', error);
                document.getElementById('address').textContent = 'Address not available';
            }
        }
        
        async function updateBusinessLocation() {
            if (!currentLocation) {
                showStatus('Please get your location first.', 'error');
                return;
            }
            
            const token = localStorage.getItem('token');
            if (!token) {
                showStatus('Please log in first.', 'error');
                return;
            }
            
            showLoading(true);
            
            try {
                const response = await fetch('/api/business/profile', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        latitude: currentLocation.latitude,
                        longitude: currentLocation.longitude,
                        address: currentAddress || `${currentLocation.latitude}, ${currentLocation.longitude}`,
                        // You can add more address details here if needed
                        city: 'Current Location',
                        state: 'Current Location',
                        country: 'India'
                    })
                });
                
                if (response.ok) {
                    showStatus('✅ Business location updated successfully!', 'success');
                } else {
                    const error = await response.json();
                    showStatus('❌ Failed to update location: ' + (error.message || 'Unknown error'), 'error');
                }
                
            } catch (error) {
                console.error('Error updating location:', error);
                showStatus('❌ Failed to update location: ' + error.message, 'error');
            } finally {
                showLoading(false);
            }
        }
        
        // Check if user is logged in
        document.addEventListener('DOMContentLoaded', function() {
            const token = localStorage.getItem('token');
            if (!token) {
                showStatus('Please log in first to update your business location.', 'error');
                document.getElementById('getLocationBtn').disabled = true;
                document.getElementById('updateLocationBtn').disabled = true;
            }
        });
    </script>
</body>
</html>
